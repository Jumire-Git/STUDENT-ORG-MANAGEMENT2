<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Student Organization Management Platform</title>
  <meta name="description" content="Sign in to your Student Organization Management account to access campus directories, room reservations, and event passes." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #f8fafc;
      color: var(--color-text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      padding: var(--space-8);
      animation: fadeIn 150ms ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-section {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .brand-badge-icon {
      width: 48px;
      height: 48px;
      background: var(--color-accent);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      margin-bottom: var(--space-4);
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
      margin-bottom: var(--space-2);
    }

    .brand-sub {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: var(--space-3);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .input-wrapper .form-control {
      padding-left: 38px;
      padding-right: 38px;
      height: 40px;
      font-size: 13px;
    }

    .input-action-btn {
      position: absolute;
      right: var(--space-3);
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
      transition: color var(--transition);
    }

    .input-action-btn:hover {
      color: var(--color-text-primary);
    }

    .login-btn {
      width: 100%;
      height: 42px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      border-radius: var(--radius-md);
      background: var(--color-accent);
      color: #fff;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition);
    }

    .login-btn:hover {
      background: var(--color-accent-hover);
      box-shadow: 0 2px 4px rgba(29, 78, 216, 0.25);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .auth-alert {
      display: none;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: 12px;
      margin-bottom: var(--space-5);
      border: 1px solid;
    }

    .auth-alert-error {
      background: var(--color-danger-bg);
      border-color: #fecaca;
      color: var(--color-danger);
    }

    .auth-alert-success {
      background: var(--color-success-bg);
      border-color: #bbf7d0;
      color: var(--color-success);
    }

    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 11px;
      font-weight: 500;
      margin: var(--space-6) 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }

    .divider-text::before {
      margin-right: var(--space-3);
    }

    .divider-text::after {
      margin-left: var(--space-3);
    }

    .sso-btn {
      width: 100%;
      height: 40px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .sso-btn:hover {
      background: var(--color-surface-2);
      border-color: #d1d5db;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
      font-size: 12px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--color-accent);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--color-accent);
      font-weight: 500;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-footer {
      text-align: center;
      padding: var(--space-6);
      font-size: 12px;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
    }

    .login-footer-links {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      margin-top: var(--space-2);
    }

    .login-footer-links a {
      color: var(--color-text-secondary);
      text-decoration: none;
    }

    .login-footer-links a:hover {
      color: var(--color-text-primary);
      text-decoration: underline;
    }

    /* Discreet quick-fill helper */
    .credentials-helper {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border-soft);
      text-align: center;
    }

    .helper-toggle {
      font-size: 11px;
      color: var(--color-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }

    .helper-toggle:hover {
      color: var(--color-text-secondary);
      background: var(--color-surface-2);
    }

    .helper-dropdown {
      display: none;
      margin-top: var(--space-3);
      padding: var(--space-3);
      background: var(--color-surface-2);
      border-radius: var(--radius-md);
      font-size: 11px;
      text-align: left;
    }

    .helper-dropdown.show {
      display: block;
    }

    .quick-account-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 11px;
      cursor: pointer;
      text-align: left;
      transition: background var(--transition);
    }

    .quick-account-btn:last-child {
      margin-bottom: 0;
    }

    .quick-account-btn:hover {
      background: var(--color-accent-light);
      border-color: #bfdbfe;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Brand Header -->
    <div class="brand-section">
      <div class="brand-badge-icon">
        <i data-lucide="graduation-cap" style="width: 24px; height: 24px;"></i>
      </div>
      <h1 class="brand-title">Sign In</h1>
      <p class="brand-sub">Student Organization Management Platform</p>
    </div>

    <!-- Alert Message -->
    <div id="auth-alert" class="auth-alert auth-alert-error" role="alert">
      <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px;"></i>
      <span id="auth-alert-message">Invalid email or password.</span>
    </div>

    <!-- Login Form -->
    <form id="form-login" novalidate>
      <div class="form-group" style="margin-bottom: var(--space-4);">
        <label class="form-label" for="input-email">Institutional Email</label>
        <div class="input-wrapper">
          <span class="input-icon-left">
            <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
          </span>
          <input
            type="email"
            id="input-email"
            class="form-control"
            placeholder="you@campus.edu"
            autocomplete="email"
            required
            value="admin@campus.edu"
          />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-4);">
        <label class="form-label" for="input-password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon-left">
            <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
          </span>
          <input
            type="password"
            id="input-password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            value="password123"
          />
          <button
            type="button"
            id="btn-toggle-password"
            class="input-action-btn"
            title="Show password"
            aria-label="Toggle password visibility"
          >
            <i data-lucide="eye" id="icon-eye" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="check-remember" checked />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Password reset instructions have been sent to your institutional email.'); return false;">Forgot password?</a>
      </div>

      <button type="submit" id="btn-submit" class="login-btn">
        <span>Sign In</span>
        <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
      </button>

      <div class="divider-text">or continue with</div>

      <button type="button" class="sso-btn" onclick="alert('Connecting to Campus Single Sign-On (SSO) Identity Provider…')">
        <i data-lucide="key-round" style="width: 16px; height: 16px; color: var(--color-text-secondary);"></i>
        <span>Campus Single Sign-On (SSO)</span>
      </button>

      <!-- Discreet Quick Demo Accounts Popover -->
      <div class="credentials-helper">
        <button type="button" id="btn-toggle-helper" class="helper-toggle">
          <i data-lucide="help-circle" style="width: 12px; height: 12px;"></i>
          <span>Mock Credentials (Click to fill)</span>
        </button>
        <div id="helper-dropdown" class="helper-dropdown">
          <div style="font-weight: 600; margin-bottom: 6px; color: var(--color-text-secondary);">Select an account to auto-fill:</div>
          <button type="button" class="quick-account-btn" onclick="fillAccount('admin@campus.edu', 'password123')">
            <span><strong>Admin:</strong> admin@campus.edu</span>
            <span class="badge badge-purple" style="font-size: 9px;">Admin</span>
          </button>
          <button type="button" class="quick-account-btn" onclick="fillAccount('officer@campus.edu', 'password123')">
            <span><strong>Officer:</strong> officer@campus.edu</span>
            <span class="badge badge-blue" style="font-size: 9px;">Officer</span>
          </button>
          <button type="button" class="quick-account-btn" onclick="fillAccount('faculty@campus.edu', 'password123')">
            <span><strong>Faculty:</strong> faculty@campus.edu</span>
            <span class="badge badge-amber" style="font-size: 9px;">Faculty</span>
          </button>
          <button type="button" class="quick-account-btn" onclick="fillAccount('student@campus.edu', 'password123')">
            <span><strong>Student:</strong> student@campus.edu</span>
            <span class="badge badge-green" style="font-size: 9px;">Student</span>
          </button>
        </div>
      </div>
    </form>

  </div>
</div>

<footer class="login-footer">
  <div>Student Organization Management Platform &copy; 2026. All rights reserved.</div>
  <div class="login-footer-links">
    <a href="#">Privacy Policy</a>
    <span>&bull;</span>
    <a href="#">Terms of Service</a>
    <span>&bull;</span>
    <a href="#">Campus Helpdesk</a>
  </div>
</footer>

<script src="js/auth.js"></script>
<script>
  // Initialize Lucide icons
  lucide.createIcons();

  const form = document.getElementById('form-login');
  const emailInput = document.getElementById('input-email');
  const passwordInput = document.getElementById('input-password');
  const submitBtn = document.getElementById('btn-submit');
  const alertBox = document.getElementById('auth-alert');
  const alertMsg = document.getElementById('auth-alert-message');
  const togglePassBtn = document.getElementById('btn-toggle-password');
  const eyeIcon = document.getElementById('icon-eye');
  const helperToggle = document.getElementById('btn-toggle-helper');
  const helperDropdown = document.getElementById('helper-dropdown');

  // Toggle password visibility
  togglePassBtn.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
    lucide.createIcons();
  });

  // Toggle mock helper
  helperToggle.addEventListener('click', () => {
    helperDropdown.classList.toggle('show');
  });

  // Quick fill function
  window.fillAccount = function(email, password) {
    emailInput.value = email;
    passwordInput.value = password;
    helperDropdown.classList.remove('show');
    alertBox.style.display = 'none';
  };

  // Form submission
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showAlert('Please enter both email and password.');
      return;
    }

    // Visual feedback
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>Signing in…</span>`;

    setTimeout(() => {
      const result = Auth.login(email, password);
      if (result.success) {
        alertBox.className = 'auth-alert auth-alert-success';
        alertMsg.textContent = `Welcome, ${result.user.name}. Redirecting to dashboard…`;
        alertBox.style.display = 'flex';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 400);
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In</span><i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>`;
        lucide.createIcons();
        showAlert(result.message);
      }
    }, 350);
  });

  function showAlert(message) {
    alertBox.className = 'auth-alert auth-alert-error';
    alertMsg.textContent = message;
    alertBox.style.display = 'flex';
    lucide.createIcons();
  }
</script>

</body>
</html>
